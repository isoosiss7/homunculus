[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homunculus"
version = "0.1.0"
description = "Minimal CLI scaffold for homunculus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright",
  "pydantic",
  "pytest",
  "ruff",
]

[project.scripts]
homunculus = "homunculus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["homunculus"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
