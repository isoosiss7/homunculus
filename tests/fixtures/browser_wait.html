<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser Wait Fixture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      #late {
        display: none;
      }

      #text-appear {
        display: none;
      }
    </style>
    <script>
      window.delayedFlag = false;

      function showLate() {
        document.getElementById("late").style.display = "inline-block";
      }

      function setFlag() {
        window.delayedFlag = true;
      }

      function showText() {
        document.getElementById("text-appear").style.display = "block";
      }

      function hideText() {
        document.getElementById("text-gone").style.display = "none";
      }

      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(showLate, 80);
        setTimeout(setFlag, 140);
        setTimeout(showText, 90);
        setTimeout(hideText, 110);
      });
    </script>
  </head>
  <body>
    <button id="late" type="button">Late button</button>
    <div id="text-appear">Hello from later text</div>
    <div id="text-gone">Goodbye soon text</div>
  </body>
</html>
