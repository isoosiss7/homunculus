<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoleRef Fixture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      #result {
        margin-top: 12px;
        font-weight: bold;
      }
    </style>
    <script>
      function setResult(value) {
        document.getElementById("result").textContent = value;
        document.title = value;
      }

      function handleUsernameKeydown(event) {
        if (event.key === "Enter") {
          setResult("pressed-enter");
        }
      }
    </script>
  </head>
  <body>
    <label for="username">User name</label>
    <input
      id="username"
      type="text"
      oninput="setResult(this.value)"
      onkeydown="handleUsernameKeydown(event)"
    />
    <label for="typing">Typing target</label>
    <input id="typing" type="text" oninput="setResult(this.value)" />
    <button type="button" onclick="setResult('clicked-0')">Submit</button>
    <button type="button" onclick="setResult('clicked-1')">Submit</button>
    <button type="button" style="display: none">Hidden Submit</button>
    <button type="button" onmouseover="setResult('hovered')">Hover target</button>
    <div id="result">idle</div>
  </body>
</html>
