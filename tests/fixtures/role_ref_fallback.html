<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Role ref fallback</title>
  </head>
  <body>
    <button id="submit" type="button">Submit now</button>
    <div id="result"></div>
    <script>
      const result = document.getElementById('result');
      document.getElementById('submit').addEventListener('click', () => {
        result.textContent = 'clicked-fallback';
      });
    </script>
  </body>
</html>
